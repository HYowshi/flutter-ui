name: Verify and publish Flutter UI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 tool/generate_ai_docs.py --check
      - run: python3 -m unittest discover -s tool -p "test_*.py"
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test
      - run: dart pub publish --dry-run
      - run: python3 tool/build_release.py
      - run: flutter analyze
      - run: flutter test
      - run: flutter test
        working-directory: example
      - run: flutter build web --release --base-href /flutter-ui/ --no-web-resources-cdn
        working-directory: example
      - run: python3 tool/generate_ai_docs.py --check --publish example/build/web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
